<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage and track your daily tasks inside TaskFlow's premium dashboard. Add, update, and search your workflow.">
  <title>Dashboard | TaskFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-layout">
    <!-- Navbar -->
    <header class="navbar">
      <a href="dashboard.html" class="nav-brand">✅ TaskFlow</a>
      <div class="nav-user">
        <span class="welcome-msg">Hello, <span id="username-display">User</span>!</span>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-container">
      
      <!-- Stats Bar -->
      <section class="stats-bar">
        <div class="stat-card total">
          <span id="stat-total" class="stat-number">0</span>
          <span class="stat-label">Total Tasks</span>
        </div>
        <div class="stat-card todo">
          <span id="stat-todo" class="stat-number">0</span>
          <span class="stat-label">To Do</span>
        </div>
        <div class="stat-card inprogress">
          <span id="stat-inprogress" class="stat-number">0</span>
          <span class="stat-label">In Progress</span>
        </div>
        <div class="stat-card done">
          <span id="stat-done" class="stat-number">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </section>

      <!-- Filter Bar -->
      <section class="filter-bar">
        <div class="filter-left">
          <div class="search-wrapper">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search tasks by title..." oninput="filterTasks()">
          </div>
          
          <select id="filter-status" class="select-filter" onchange="filterTasks()">
            <option value="all">All Statuses</option>
            <option value="todo">To Do</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
          </select>
          
          <select id="filter-priority" class="select-filter" onchange="filterTasks()">
            <option value="all">All Priorities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        
        <button class="btn-add" onclick="openAddModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add Task
        </button>
      </section>

      <!-- Tasks Grid -->
      <section id="tasks-grid" class="tasks-grid">
        <!-- Dynamic Task Cards will be rendered here -->
      </section>

    </main>
  </div>

  <!-- Modal overlay for Add/Edit task -->
  <div id="task-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Add New Task</h3>
        <button class="btn-close-modal" onclick="closeModal()">&times;</button>
      </div>
      
      <form id="task-form" onsubmit="saveTask(event)">
        <input type="hidden" id="task-id">
        
        <div class="form-group">
          <label for="task-title" class="form-label">Title *</label>
          <input type="text" id="task-title" class="form-input" placeholder="Enter task title" required>
        </div>

        <div class="form-group">
          <label for="task-desc" class="form-label">Description</label>
          <textarea id="task-desc" class="form-input" placeholder="Enter task details" rows="3" style="resize: vertical; font-family: inherit;"></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="task-status" class="form-label">Status</label>
            <select id="task-status" class="form-input">
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          
          <div class="form-group" style="margin-bottom: 0;">
            <label for="task-priority" class="form-label">Priority</label>
            <select id="task-priority" class="form-input">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="task-due-date" class="form-label">Due Date</label>
          <input type="date" id="task-due-date" class="form-input">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-save">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notifications Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="dashboard.js"></script>
</body>
</html>
